<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMOTE — Beliefs, values rows with photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --black:#000; --fill:#1A1A1A; --line:#333; --primary:#fff; --secondary:#999; --reveal: cubic-bezier(.16,1,.3,1); --ease: cubic-bezier(.215,.61,.355,1); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--black); color: var(--primary); font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
  .nav { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 12px 40px; background: rgba(0,0,0,.92); border-bottom: 1px solid var(--line); }
  .nav a { color: var(--primary); text-decoration: none; border: 1px solid var(--line); border-radius: 9999px; height: 36px; padding: 0 20px; display: inline-flex; align-items: center; font-size: 14px; }
  .nav a:hover { background: var(--fill); }
  section { padding: 140px 40px 120px; }
  .st { font-family: "Instrument Sans", "Inter", sans-serif; font-weight: 500; font-size: 64px; line-height: 64px; }
  .head { margin-bottom: 40px; }
  .tag { color: var(--secondary); font-weight: 500; text-transform: uppercase; margin-bottom: 24px; }

  /* ---- Рядок: назва | фото | текст ------------------------------------- */
  .list { border-bottom: 1px solid var(--line); }
  .row {
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    padding: 24px 0;
    align-items: start;
  }
  .row .name { color: var(--secondary); transition: color .5s var(--ease); padding-top: 8px; }
  .row:hover .name, .row:focus-within .name { color: var(--primary); }
  .row .num { display: block; font-family: "Inter", sans-serif; font-size: 12px; line-height: 16px; color: var(--secondary); margin-bottom: 16px; }
  .photo { position: relative; aspect-ratio: 4/3; background: var(--fill); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--reveal); }
  .row:hover .photo img { transform: scale(1.05); }
  .text { font-size: 20px; line-height: 28px; color: var(--secondary); padding-top: 8px; max-width: 520px; transition: color .5s var(--ease); }
  .row:hover .text { color: var(--primary); }

  /* поява */
  .row > * { opacity: 0; transform: translateY(32px); transition: opacity .6s ease, transform 1.2s var(--reveal); }
  .row.in > * { opacity: 1; transform: none; }
  .row.in > :nth-child(2) { transition-delay: .1s; }
  .row.in > :nth-child(3) { transition-delay: .2s; }

  @media (max-width: 1100px) { .row { grid-template-columns: 1fr 1fr; } .row .text { grid-column: 1 / -1; max-width: none; padding-top: 0; } }
  @media (max-width: 700px) {
    .nav, section { padding-left: 16px; padding-right: 16px; }
    .st { font-size: 40px; line-height: 48px; }
    .row { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .row > * { opacity: 1; transform: none; transition: none; } .photo img { transition: none; } }
</style>
</head>
<body>
<nav class="nav"><a href="#v1">Варіант 1 · Фото посередині</a><a href="#v2">Варіант 2 · Фото ліворуч</a></nav>

<section id="v1">
  <p class="tag">Варіант 1 · Назва | фото | текст (як у референсі)</p>
  <h2 class="st head">Four things we<br>don't compromise on.</h2>
  <div class="list" id="list1"></div>
</section>

<section id="v2">
  <p class="tag">Варіант 2 · Фото ліворуч, назва й текст праворуч</p>
  <h2 class="st head">Four things we<br>don't compromise on.</h2>
  <div class="list" id="list2"></div>
</section>

<script>
  const B = [
    ["Small on purpose", "A senior team you can name, not a pyramid of juniors behind one account manager."],
    ["Embedded from day one", "We work inside your Slack, Figma and roadmap, not across a wall."],
    ["Design that ships", "The people who drew it are the ones answering questions when it gets built."],
    ["Straight talk", "If something won't work, you hear it from us before it costs you."],
  ];
  const n = i => String(i + 1).padStart(2, "0");
  const slug = t => t.toLowerCase().replace(/[^a-z]+/g, "-");
  const photo = t => `<div class="photo">${t}<img src="../../public/beliefs/${slug(t)}.png" alt="" onerror="this.remove()"></div>`;

  document.getElementById("list1").innerHTML = B.map(([t, d], i) =>
    `<article class="row" tabindex="0">
      <h3 class="st name"><span class="num">${n(i)}</span>${t}</h3>
      ${photo(t)}
      <p class="text">${d}</p>
    </article>`).join("");

  document.getElementById("list2").innerHTML = B.map(([t, d], i) =>
    `<article class="row" tabindex="0" style="grid-template-columns: 1fr 1fr 1fr">
      ${photo(t)}
      <h3 class="st name"><span class="num">${n(i)}</span>${t}</h3>
      <p class="text">${d}</p>
    </article>`).join("");

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .2 });
  document.querySelectorAll(".row").forEach(r => io.observe(r));
</script>
</body>
</html>
